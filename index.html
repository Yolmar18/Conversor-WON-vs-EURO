<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Conversor EUR / KRW</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0B0F19; color: #F8FAFC; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #0F172A; border: 1px solid #1E293B; border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem; color: #94A3B8; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #1E293B; font-weight: 600; font-size: 0.75rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #EF4444; }
    .dot.online { background: #10B981; }
    .input-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.8rem; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .input-box { display: flex; align-items: center; background: #1E293B; border: 1px solid #334155; border-radius: 12px; padding: 12px 16px; }
    input { background: transparent; border: none; color: #fff; font-size: 1.5rem; font-weight: 600; width: 100%; outline: none; }
    .currency-tag { font-weight: bold; font-size: 1.1rem; color: #38BDF8; margin-left: 10px; }
    .swap-btn { display: flex; align-items: center; justify-content: center; margin: 12px auto; background: #334155; border: none; color: #F8FAFC; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
    .swap-btn:active { transform: scale(0.92); }
    .rate-info { margin-top: 20px; text-align: center; font-size: 0.8rem; color: #64748B; border-top: 1px solid #1E293B; padding-top: 16px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="status-bar">
      <span id="rateText">1 EUR = 1,485 KRW</span>
      <span class="badge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Comprobando...</span>
      </span>
    </div>

    <div class="input-group">
      <label id="labelFrom">Cantidad en Euros (€)</label>
      <div class="input-box">
        <input type="number" id="inputFrom" placeholder="0" inputmode="decimal">
        <span class="currency-tag" id="symbolFrom">EUR</span>
      </div>
    </div>

    <button class="swap-btn" id="swapBtn" title="Invertir divisa">⇅</button>

    <div class="input-group">
      <label id="labelTo">Resultado en Wones (₩)</label>
      <div class="input-box">
        <input type="text" id="inputTo" placeholder="0" readonly>
        <span class="currency-tag" id="symbolTo">KRW</span>
      </div>
    </div>

    <div class="rate-info" id="updateInfo">
      Tasa guardada localmente para modo offline.
    </div>
  </div>

  <script>
    let rate = parseFloat(localStorage.getItem('eur_krw_rate')) || 1485.0;
    let mode = 'EUR_TO_KRW';

    const inputFrom = document.getElementById('inputFrom');
    const inputTo = document.getElementById('inputTo');
    const swapBtn = document.getElementById('swapBtn');
    const labelFrom = document.getElementById('labelFrom');
    const labelTo = document.getElementById('labelTo');
    const symbolFrom = document.getElementById('symbolFrom');
    const symbolTo = document.getElementById('symbolTo');
    const rateText = document.getElementById('rateText');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const updateInfo = document.getElementById('updateInfo');

    function calculate() {
      const val = parseFloat(inputFrom.value);
      if (isNaN(val) || val <= 0) {
        inputTo.value = '';
        return;
      }
      if (mode === 'EUR_TO_KRW') {
        inputTo.value = Math.round(val * rate).toLocaleString('es-ES');
      } else {
        inputTo.value = (val / rate).toFixed(2).replace('.', ',');
      }
    }

    function toggleMode() {
      mode = (mode === 'EUR_TO_KRW') ? 'KRW_TO_EUR' : 'EUR_TO_KRW';
      if (mode === 'EUR_TO_KRW') {
        labelFrom.textContent = 'Cantidad en Euros (€)';
        symbolFrom.textContent = 'EUR';
        labelTo.textContent = 'Resultado en Wones (₩)';
        symbolTo.textContent = 'KRW';
      } else {
        labelFrom.textContent = 'Cantidad en Wones (₩)';
        symbolFrom.textContent = 'KRW';
        labelTo.textContent = 'Resultado en Euros (€)';
        symbolTo.textContent = 'EUR';
      }
      inputFrom.value = '';
      inputTo.value = '';
    }

    async function fetchRate() {
      if (!navigator.onLine) {
        setOfflineStatus();
        return;
      }
      try {
        const res = await fetch('https://api.frankfurter.app/latest?from=EUR&to=KRW');
        const data = await res.json();
        if (data && data.rates && data.rates.KRW) {
          rate = data.rates.KRW;
          localStorage.setItem('eur_krw_rate', rate);
          const now = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          localStorage.setItem('eur_krw_time', now);
          setOnlineStatus(now);
        }
      } catch (e) {
        setOfflineStatus();
      }
      rateText.textContent = `1 EUR = ${Math.round(rate).toLocaleString('es-ES')} KRW`;
      calculate();
    }

    function setOnlineStatus(time) {
      statusDot.className = 'dot online';
      statusText.textContent = 'Online';
      updateInfo.textContent = `Actualizado hoy a las ${time || 'recientemente'}`;
    }

    function setOfflineStatus() {
      statusDot.className = 'dot';
      statusText.textContent = 'Offline';
      const lastTime = localStorage.getItem('eur_krw_time') || 'previa';
      updateInfo.textContent = `Modo sin conexión. Usando tasa guardada (${lastTime}).`;
    }

    inputFrom.addEventListener('input', calculate);
    swapBtn.addEventListener('click', toggleMode);
    window.addEventListener('online', fetchRate);
    window.addEventListener('offline', setOfflineStatus);

    fetchRate();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
